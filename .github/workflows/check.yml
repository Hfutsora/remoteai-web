name: Web checks and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Install bundled Chromium
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Verify startup and update behavior at mobile and desktop widths
        if: runner.os == 'Linux'
        run: npm run test:startup-update:e2e
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && success()
        with:
          name: web-dist
          path: dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-diagnostics-${{ matrix.os }}
          path: test-results

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t remoteai-web:check .
